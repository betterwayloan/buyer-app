<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:#1c1c1c;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.card{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 26px) 24px calc(env(safe-area-inset-bottom) + 24px)}
.co{font:700 22px/1.1 Manrope,sans-serif;letter-spacing:-.01em}
.area{font:500 15px Manrope,sans-serif;margin-top:4px}
.photo{margin-top:22px;aspect-ratio:1/1;max-height:42vh;max-height:42dvh;width:100%;border-radius:4px;overflow:hidden;background:#f2f2f2}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.name{font:400 36px/1.05 Newsreader,Georgia,serif;letter-spacing:-.01em;margin-top:22px}
.role{font:500 16px Manrope,sans-serif;margin-top:6px}
.hr{height:1px;background:#e6e6e6;margin:18px 0}
.row{display:grid;grid-template-columns:1fr 108px;gap:16px;align-items:end}
.lines{display:flex;flex-direction:column;gap:8px;font-size:15px}
.small{color:#8a8a8a;font-size:12px;line-height:1.4}
.qr svg{width:100%;height:auto;display:block}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:22px}
.btn{height:52px;display:flex;align-items:center;justify-content:center;font:700 13px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:2px}
.call{background:#1c1c1c;color:#fff}.save{border:1px solid #1c1c1c}
.hint{font-size:12px;color:#8a8a8a;text-align:center;line-height:1.5;margin-top:14px}
</style>
